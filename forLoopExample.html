<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <input type="text" id="num">
    <button onclick="check()">Check</button>
    <h1 id="result"></h1>
    <script>
        let values = [8,3,7,1,9,4,2,5];
        function check(){
            let getVal = Number(document.getElementById("num").value);
            for(i=0;i<values.length;i++){
                if(getVal == values[i]){
                    document.getElementById("result").innerHTML = `${values[i]} is matched`;
                }
                else{
                    document.getElementById("result").innerHTML = `not matched`;
                }

            }
        }
        

    </script>
</body>
</html>
